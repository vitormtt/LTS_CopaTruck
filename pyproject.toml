[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lap_time_simulator"
version = "0.1.0"
description = "Lap time simulator (Copa Truck) - CLI and Streamlit UI"
authors = [ { name = "vitor" } ]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.11.0",
  "pandas>=2.0.0",
  "h5py>=3.9.0",
  "matplotlib>=3.7.0",
  "plotly>=5.0.0",
  "streamlit>=1.28.0",
  "reportlab>=4.1.0"
]

[project.scripts]
lap-sim = "lap_time_simulator.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Entry-point/bootstrap files insert the repo root into sys.path before
# importing src.*, so their imports legitimately cannot sit at the top.
"src/database/db_manager.py" = ["E402"]
"src/database/migrate.py" = ["E402"]
"src/database/seed_db.py" = ["E402"]
"src/visualization/interface.py" = ["E402"]
"src/visualization/components/helpers.py" = ["E402"]
"src/visualization/components/vehicle_params.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
