version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: copa_truck_db
    restart: always
    environment:
      POSTGRES_USER: saru_admin
      POSTGRES_PASSWORD: saru_pass
      POSTGRES_DB: copa_truck_sim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/db_schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
    driver: local
